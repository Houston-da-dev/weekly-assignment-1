<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mustache Enthusiast - Blog Single Post</title>
        <link rel="stylesheet" href="style.css">
        <style>
            section{
                margin-bottom: 60px;
            }

            input{
                width: 700px;
                height: 60px;
                text-align: center;
                font-size: 20px;
                margin: 20px;
                border: #333 3px solid;
            }

            form{
                display: flex;
                flex-direction: column;
            }

            #message{
                padding-bottom: 440px;
                height: 500px;
            }

            #submit{
                width: 150px;
                background-color: #333;
                border: 3px solid #333;
                color: white;
                margin: 5px auto;
            }

            #submit:hover{
                background-color: white;
                color: #333;
            }
        </style>
    </head>
    <body>
        <header>
            <a href="index.html"><img src="images/logo.jpg" alt="Mustacchio's logo" id="logo"></a>
            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="gallery.html">GALLERY</a></li>
                    <li><a href="blog.html">BLOG</a></li>
                    <li><a href="contact.html" class="selected">CONTACT</a></li>
                </ul>
            </nav>
        </header>
        <section>
            <h1>LET'S KEEP IN TOUCH</h1>
            <form action="contact.html" method="post">
                <input type="text" placeholder="NAME" required>
                <input type="text" placeholder="ADDRESS" required>
                <input type="text" placeholder="EMAIL" required>
                <input type="text" placeholder="PHONE NUMBER" required>
                <input type="text" placeholder="MESSAGE" id="message">
                <input type="submit" id="submit">
            </form>
        </section>
        <footer>
            <p>&copy; 2023 by mustacchio. All rights reserved.</p>
            <div class="flexbox">
                <div id="twitter" class="icon"></div>
                <div id="facebook" class="icon"></div>
                <div id="google" class="icon"></div>
                <div id="pintrest" class="icon"></div>
            </div>
        </footer>
    </body>
</html>
